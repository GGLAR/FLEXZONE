<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Flexzone</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="container navbar">
    <div class="logo">Flexzone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="programs.html">Programs</a>
      <a href="pricing.html">Plans</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="admin.html" class="logout">Admin</a>
    </nav>
  </div>
</header>

<section class="page-header">
  <h1>Contact Us</h1>
  <p>Book your free trial or send us a message!</p>
</section>

<section class="contact container">

  <form id="contactForm" aria-label="Contact form">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>

    <select id="program" required>
      <option value="">Select Program</option>
      <option>Biceps</option>
      <option>Back</option>
      <option>Chest</option>
      <option>Leg</option>
      <option>Core</option>
      <option>Arm</option>
      <option>Cardio</option>
      <option>Recovery Flow</option>
    </select>

    <textarea id="message" placeholder="Your Message"></textarea>

    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>

  <div class="hours">
    <h3>Opening Hours</h3>
    <p>Mon–Sun: 24/7</p>
    <p>Saturday: 8:00am to 5:00pm</p>
    <p>Sunday: Closed </p>
    <h3>Location</h3>
    <p>Lucena City, Ibabang Dupay, Montreal Street</p>
  </div>
</section>

<footer>© 2025 Flexzone — Built for the Strong.</footer>

<script src="script.js"></script>
<script>

  let savedProgram = localStorage.getItem("selectedProgram");
  if (savedProgram) {
    const sel = document.getElementById("program");
    let exists = Array.from(sel.options).some(o => o.value === savedProgram);
    if (!exists) {
      const opt = document.createElement("option");
      opt.value = savedProgram;
      opt.textContent = savedProgram;
      sel.appendChild(opt);
    }
    sel.value = savedProgram;
  }

  const savedPlan = localStorage.getItem("selectedPlan") || "";

  document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();
    const program = document.getElementById("program").value;
    const plan = savedPlan;
    const date = new Date().toLocaleString();

    const entry = { name, email, message, program, plan, date };

    const stored = JSON.parse(localStorage.getItem("signups")) || [];
    stored.push(entry);
    localStorage.setItem("signups", JSON.stringify(stored));

    localStorage.removeItem("selectedPlan");
    localStorage.removeItem("selectedProgram");

    alert("Message sent successfully!");
    this.reset();
  });

</script>

</body>
</html>
