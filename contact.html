<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexzone — Contact & Signup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.jpg">
</head>
<body>

  <form id="signupForm">

    <label>Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Program</label>
    <select id="program" required>
      <option value="">Select Program</option>
      <option>Full Body Workout</option>
      <option>Fat Loss</option>
      <option>Muscle Gain</option>
      <option>Strength Training</option>
    </select>

    <label>Plan</label>
    <select id="plan" required>
      <option value="">Select Plan</option>
      <option>Basic</option>
      <option>Standard</option>
      <option>Premium</option>
    </select>

    <button type="submit" class="btn">Submit</button>
  </form>

  <p id="msg" style="margin-top:20px; font-weight:bold;"></p>

</div>

<script>
  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const program = document.getElementById('program').value;
    const plan = document.getElementById('plan').value;
    const date = new Date().toLocaleString();

    const newEntry = { name, email, program, plan, date };
    const stored = JSON.parse(localStorage.getItem('signups')) || [];
    stored.push(newEntry);
    localStorage.setItem('signups', JSON.stringify(stored));

    document.getElementById('msg').textContent = "Your signup has been submitted successfully!";
    this.reset();
  });
</script>

</body>
</html>
