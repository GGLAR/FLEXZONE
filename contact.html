<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Flexzone</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="container navbar">
    <div class="logo">Flexzone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="programs.html">Programs</a>
      <a href="pricing.html">Plans</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="admin.html" class="logout">Admin</a>
    </nav>
  </div>
</header>

<section class="page-header">
  <h1>Contact Us</h1>
  <p>Book your free trial or send us a message!</p>
</section>

<section class="contact container">

  <form id="contactForm">

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>

    <select id="programSelect" required>
      <option value="">Select Program</option>
      <option value="Bicep Day">Bicep Day</option>
      <option value="Back Day">Back Day</option>
      <option value="Chest Day">Chest Day</option>
      <option value="Leg Day">Leg Day</option>
      <option value="Core Day">Core Day</option>
      <option value="Arm Day">Arm Day</option>
      <option value="Cardio">Cardio</option>
      <option value="Recovery Flow">Recovery Flow</option>
      <option value="Zumba">Zumba</option>
    </select>

    <select id="planType" required>
      <option value="">Select Plan Type</option>
      <option value="Student">Student</option>
      <option value="Regular">Regular</option>
    </select>

    <textarea id="message" placeholder="Your Message"></textarea>

    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>

  <div class="hours">
    <h3>Opening Hours</h3>
    <p>Mon–Sun: 24/7</p>
    <p>Saturday: 8:00am to 5:00pm</p>
    <p>Sunday: Closed</p>

    <h3>Location</h3>
    <p>Lucena City, Ibabang Dupay, Montreal Street</p>
  </div>

</section>

<footer>© 2025 Flexzone — Built for the Strong.</footer>

<script src="script.js"></script>

<!-- CLEAN FINAL SCRIPT -->
<script>
const params = new URLSearchParams(window.location.search);
const selectedProgram = params.get("program");

// Autofill program from URL
if (selectedProgram) {
    const dropdown = document.getElementById("programSelect");
    
    // Check if exists in list, if not add dynamically
    if (![...dropdown.options].some(opt => opt.value === selectedProgram)) {
        const opt = document.createElement("option");
        opt.value = selectedProgram;
        opt.textContent = selectedProgram;
        dropdown.appendChild(opt);
    }

    dropdown.value = selectedProgram;
}

// Form handler
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    const entry = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        program: document.getElementById("programSelect").value,
        planType: document.getElementById("planType").value,
        message: document.getElementById("message").value.trim(),
        date: new Date().toLocaleString()
    };

    const stored = JSON.parse(localStorage.getItem("signups")) || [];
    stored.push(entry);
    localStorage.setItem("signups", JSON.stringify(stored));

    this.reset();
    window.location.href = "admin.html";
});
</script>

</body>
</html>
