<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Flexzone</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="container navbar">
    <div class="logo">Flexzone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="programs.html">Programs</a>
      <a href="pricing.html">Plans</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="admin.html" class="logout">Admin</a>
    </nav>
  </div>
</header>

<section class="page-header">
  <h1>Contact Us</h1>
  <p>Book your free trial or send us a message!</p>
</section>

<section class="contact container">
  <form id="contactForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <select id="program">
      <option value="">Select Program</option>
      <option>Biceps</option>
      <option>Back</option>
      <option>Chest</option>
      <option>Leg</option>
      <option>Core</option>
      <option>Arm</option>
      <option>Cardio</option>
      <option>Recovery Flow</option>
    </select>
    <textarea id="message" placeholder="Your Message"></textarea>
    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>

  <div class="hours">
    <h3>Opening Hours</h3>
    <p>Mon–Sun: 24/7</p>
    <p>Saturday: 8:00am to 5:00pm</p>
    <p>Sunday: Closed</p>
    <h3>Location</h3>
    <p>Lucena City, Ibabang Dupay, Montreal Street</p>
  </div>
</section>

<footer>© 2025 Flexzone — Built for the Strong.</footer>

<script src="script.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedProgram = localStorage.getItem("selectedProgram");
if (selectedProgram) {
  const sel = document.getElementById("program");
  let found = Array.from(sel.options).some(o => o.value === selectedProgram);
  if (!found) {
    const opt = document.createElement('option');
    opt.value = selectedProgram;
    opt.textContent = selectedProgram;
    sel.appendChild(opt);
  }
  sel.value = selectedProgram;
}

const selectedPlan = localStorage.getItem("selectedPlan") || "";

document.getElementById("contactForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();
  const program = document.getElementById("program").value;
  const plan = selectedPlan;
  const date = new Date().toLocaleString();

  await addDoc(collection(db, "signups"), {
    name: name,
    email: email,
    message: message,
    program: program,
    plan: plan,
    date: date
  });

  localStorage.removeItem("selectedPlan");
  localStorage.removeItem("selectedProgram");

  window.location.href = "admin.html";
});

</script>

</body>
</html>
