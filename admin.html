<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexzone Admin Panel</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sidebar" role="navigation" aria-label="Admin sidebar">
  <h2>Admin Panel</h2>
  <a href="index.html">Home</a>
  <a href="programs.html">Programs / Workouts</a>
  <a href="pricing.html">Plans</a>
  <a href="contact.html">Contact</a>
  <a href="admin.html" id="logoutBtn" class="logout">Logout</a>
</div>

<div class="main-content">
  <h1>Welcome, Admin</h1>

  <h2>Recent Signups</h2>

  <table id="signupTable" aria-live="polite">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Program</th>
        <th>Plan</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
  function loadSignups() {
    const stored = JSON.parse(localStorage.getItem('signups')) || [];
    const tbody = document.querySelector('#signupTable tbody');
    tbody.innerHTML = '';

    stored.slice().reverse().forEach((u, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(u.name || '')}</td>
        <td>${escapeHtml(u.email || '')}</td>
        <td>${escapeHtml(u.program || '-')}</td>
        <td>${escapeHtml(u.plan || '-')}</td>
        <td>${escapeHtml(u.date || '')}</td>
        <td>
          <button class="edit-btn" data-idx="${stored.length - 1 - idx}">Edit</button>
          <button class="delete-btn" data-idx="${stored.length - 1 - idx}">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const i = Number(this.getAttribute('data-idx'));
        deleteSignup(i);
      });
    });

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const i = Number(this.getAttribute('data-idx'));
        editSignup(i);
      });
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function deleteSignup(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    if (index < 0 || index >= arr.length) return;
    arr.splice(index, 1);
    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  function editSignup(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    const u = arr[index];
    if (!u) return;
    const newName = prompt('Edit name:', u.name) || u.name;
    const newEmail = prompt('Edit email:', u.email) || u.email;
    const newProgram = prompt('Edit program:', u.program || '') || u.program;
    const newPlan = prompt('Edit plan:', u.plan || '') || u.plan;
    arr[index] = { ...u, name: newName, email: newEmail, program: newProgram, plan: newPlan };
    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  document.getElementById('logoutBtn').addEventListener('click', function (e) {
    e.preventDefault();
    localStorage.removeItem('adminAuth');
    window.location.href = 'admin.html';
  });

  loadSignups();
</script>

</body>
</html>
