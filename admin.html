<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexzone Admin Panel</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
  const isLogged = localStorage.getItem("adminAuth") === "1";
</script>

<div id="loginSection" style="display:none; text-align:center; margin-top:80px;">
  <h2>Admin Login</h2>
  <input id="user" type="text" placeholder="Username" style="padding:8px; width:200px;"><br><br>
  <input id="pass" type="password" placeholder="Password" style="padding:8px; width:200px;"><br><br>
  <button id="loginBtn" style="padding:10px 20px;">Login</button>
  <p id="error" style="color:red; display:none;">Invalid username or password</p>
</div>

<div id="admin" style="display:none;">

<div class="sidebar" role="navigation" aria-label="Admin sidebar">
  <h2>ADMIN</h2>
  <a href="index.html">Home</a>
  <a href="programs.html">Programs / Workouts</a>
  <a href="pricing.html">Plans</a>
  <a href="contact.html">Contact</a>
  <a href="admin.html" id="logoutBtn" class="logout">Logout</a>
</div>

<div class="main-content">
  <h1>Welcome, Admin</h1>
  <h2>Recent Signups</h2>
  <table id="signupTable" aria-live="polite">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Program</th>
        <th>Plan</th>
        <th>Plan Type</th>
        <th>Date Register</th>
        <th>Date End</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
</div>


<select id="workoutSelect">
  <option value="">Choose workout</option>
  <option value="Leg Day">Leg Day</option>
  <option value="Push Day">Push Day</option>
  <option value="Pull Day">Pull Day</option>
  <option value="Cardio Day">Cardio Day</option>
</select>

<script>
  if (isLogged) {
    document.getElementById("admin").style.display = "block";
    document.getElementById("loginSection").style.display = "none";
  } else {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("admin").style.display = "none";
  }
</script>

<script>
  function formatDate(dateString) {
    if (!dateString) return "";
    const d = new Date(dateString);
    const options = { year: "numeric", month: "long", day: "numeric" };
    return d.toLocaleDateString("en-US", options);
  }

  document.getElementById("loginBtn")?.addEventListener("click", function () {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    if (u === "ANGELO VERZO" && p === "HAHAHA") {
      localStorage.setItem("adminAuth", "1");
      location.reload();
    } else {
      document.getElementById("error").style.display = "block";
    }
  });

  document.getElementById("logoutBtn")?.addEventListener("click", function (e) {
    e.preventDefault();
    localStorage.removeItem("adminAuth");
    location.reload();
  });

  function loadSignups() {
    const stored = JSON.parse(localStorage.getItem('signups')) || [];
    const tbody = document.querySelector('#signupTable tbody');
    tbody.innerHTML = '';

    stored.slice().reverse().forEach((u, idx) => {
      if (!u.date) u.date = new Date().toISOString().split("T")[0];
      if (!u.dateEnd && u.date) {
        const start = new Date(u.date);
        const end = new Date(start);
        end.setDate(start.getDate() + 30);
        u.dateEnd = end.toISOString().split("T")[0];
      }
      if (!u.planType) u.planType = "Regular";

      const originalIndex = stored.length - 1 - idx;
      stored[originalIndex] = u;
      localStorage.setItem("signups", JSON.stringify(stored));

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(u.name || '')}</td>
        <td>${escapeHtml(u.email || '')}</td>
        <td>${escapeHtml(u.program || '-')}</td>
        <td>${escapeHtml(u.plan || '-')}</td>
        <td>${escapeHtml(u.planType || '-')}</td>
        <td>${formatDate(u.date)}</td>
        <td>${formatDate(u.dateEnd)}</td>
        <td>
          <button class="edit-btn" data-idx="${originalIndex}">Edit</button>
          <button class="renew-btn" data-idx="${originalIndex}">Renew</button>
          <button class="delete-btn" data-idx="${originalIndex}">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const i = Number(this.getAttribute('data-idx'));
        deleteSignup(i);
      });
    });

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const i = Number(this.getAttribute('data-idx'));
        editSignup(i);
      });
    });

    document.querySelectorAll('.renew-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const i = Number(this.getAttribute('data-idx'));
        renewSignupPrompt(i);
      });
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function deleteSignup(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    if (index < 0 || index >= arr.length) return;
    arr.splice(index, 1);
    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  function editSignup(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    const u = arr[index];
    if (!u) return;
    const newName = prompt('Edit name:', u.name) || u.name;
    const newEmail = prompt('Edit email:', u.email) || u.email;
    const newProgram = prompt('Edit program:', u.program || '') || u.program;
    const newPlan = prompt('Edit plan:', u.plan || '') || u.plan;
    const newPlanType = prompt('Edit plan type:', u.planType || '') || u.planType;
    const newDateEnd = prompt('Edit end date:', u.dateEnd || '') || u.dateEnd;

    arr[index] = { 
      ...u, 
      name: newName, 
      email: newEmail, 
      program: newProgram, 
      plan: newPlan, 
      planType: newPlanType, 
      dateEnd: newDateEnd 
    };

    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  function renewSignupPrompt(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    const u = arr[index];
    if (!u) return;

    const now = new Date();
    const defaultStart = now.toISOString().split("T")[0];

    const end = new Date(now);
    end.setDate(now.getDate() + 30);

    const defaultEnd = end.toISOString().split("T")[0];

    const newDate = prompt('Renew Date Register:', defaultStart) || defaultStart;
    const newDateEnd = prompt('Renew Date End:', defaultEnd) || defaultEnd;

    arr[index] = { 
      ...u, 
      date: newDate, 
      dateEnd: newDateEnd 
    };

    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  if (isLogged) loadSignups();
</script>

</body>
</html>
