<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexzone Admin Panel</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("adminAuth") === "1") {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("panelSection").style.display = "block";
      loadSignups();
    }
  });
</script>

<div id="loginSection">
  <h2>Admin Login</h2>

  <label>Username:</label>
  <input type="text" id="username">

  <label>Password:</label>
  <input type="password" id="password">

  <button onclick="loginAdmin()">Login</button>

  <p id="errorMsg" style="color:red;"></p>
</div>

<div id="panelSection" style="display:none;">

  <div class="sidebar" role="navigation" aria-label="Admin sidebar">
    <h2>Admin Panel</h2>
    <a href="index.html">Home</a>
    <a href="programs.html">Programs / Workouts</a>
    <a href="pricing.html">Plans</a>
    <a href="contact.html">Contact</a>
    <a href="#" id="logoutBtn" class="logout">Logout</a>
  </div>

  <div class="main-content">
    <h1>Welcome, Admin</h1>

    <h2>Recent Signups</h2>

    <table id="signupTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Program</th>
          <th>Plan</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

</div>

<script>
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "12345";

  function loginAdmin() {
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;

    if (u === ADMIN_USER && p === ADMIN_PASS) {
      localStorage.setItem("adminAuth", "1");
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("panelSection").style.display = "block";
      loadSignups();
    } else {
      document.getElementById("errorMsg").textContent = "Incorrect username or password.";
    }
  }

  function loadSignups() {
    const stored = JSON.parse(localStorage.getItem('signups')) || [];
    const tbody = document.querySelector('#signupTable tbody');
    tbody.innerHTML = '';

    stored.slice().reverse().forEach((u, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.name || ""}</td>
        <td>${u.email || ""}</td>
        <td>${u.program || "-"}</td>
        <td>${u.plan || "-"}</td>
        <td>${u.date || ""}</td>
        <td>
          <button onclick="editSignup(${stored.length - 1 - idx})">Edit</button>
          <button onclick="deleteSignup(${stored.length - 1 - idx})">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteSignup(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    arr.splice(index, 1);
    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  function editSignup(index) {
    const arr = JSON.parse(localStorage.getItem('signups')) || [];
    const u = arr[index];
    if (!u) return;

    const newName = prompt("Edit name:", u.name);
    const newEmail = prompt("Edit email:", u.email);
    const newProgram = prompt("Edit program:", u.program);
    const newPlan = prompt("Edit plan:", u.plan);

    arr[index] = { ...u, name: newName, email: newEmail, program: newProgram, plan: newPlan };
    localStorage.setItem('signups', JSON.stringify(arr));
    loadSignups();
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("adminAuth");
    location.reload();
  });
</script>

</body>
</html>
