<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexzone Admin</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<script>
  if (localStorage.getItem('adminAuth') !== '1') {
    window.location.href = "admin.html";
  }
</script>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <a href="index.html">Home</a>
  <a href="programs.html">Programs / Workouts</a>
  <a href="pricing.html">Plans</a>
  <a href="contact.html">Contact</a>
  <a href="admin.html" id="logoutBtn" class="logout">Logout</a>
</div>

<div class="main-content">
  <h1>Welcome, Admin</h1>

  <h2>Recent Signups</h2>

  <table id="signupTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Program</th>
        <th>Plan</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc, getDoc, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDQ-dn4tUmETNMbagt5CZbIf4T8g2rv_Z8",
    authDomain: "flexzone-75001.firebaseapp.com",
    projectId: "flexzone-75001",
    storageBucket: "flexzone-75001.appspot.com",
    messagingSenderId: "441698000524",
    appId: "1:441698000524:web:58b7a1e4e7cc11633165a9",
    measurementId: "G-HNQ8P59D12"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadSignups(){
    const tbody = document.querySelector("#signupTable tbody");
    tbody.innerHTML = "";

    const q = query(collection(db, "signups"), orderBy("date", "desc"));
    const snap = await getDocs(q);

    snap.forEach(d => {
      const u = d.data();
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${u.program}</td>
        <td>${u.plan}</td>
        <td>${u.date}</td>
        <td>
          <button onclick="editSignup('${d.id}')">Edit</button>
          <button onclick="deleteSignup('${d.id}')">Delete</button>
        </td>
      `;

      tbody.appendChild(tr);
    });
  }

  window.deleteSignup = async function(id){
    await deleteDoc(doc(db, "signups", id));
    loadSignups();
  }

  window.editSignup = async function(id){
    const ref = doc(db, "signups", id);
    const snap = await getDoc(ref);
    const u = snap.data();

    const newName = prompt("Name:", u.name);
    const newEmail = prompt("Email:", u.email);
    const newProgram = prompt("Program:", u.program);
    const newPlan = prompt("Plan:", u.plan);

    await updateDoc(ref, {
      name: newName,
      email: newEmail,
      program: newProgram,
      plan: newPlan
    });

    loadSignups();
  }

  loadSignups();
</script>

<script>
  document.getElementById('logoutBtn').addEventListener('click', function(e){
    e.preventDefault();
    localStorage.removeItem('adminAuth');
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
